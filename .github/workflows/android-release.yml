name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test changed-file gate
        run: node --test scripts/android-build-needed.test.mjs
      - name: Classify changed files
        id: changes
        run: node scripts/android-build-needed.mjs
      - name: Docs-only result
        if: steps.changes.outputs.build == 'false'
        run: echo 'Explicitly allowlisted documentation only; Android build not needed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7.1.0
        if: steps.changes.outputs.build != 'false'
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/setup-java@v6.1.0
        if: steps.changes.outputs.build != 'false'
        with:
          distribution: temurin
          java-version: '21'
      - name: Isolate Gradle user home
        if: steps.changes.outputs.build != 'false'
        # Only this unsigned build uses the cache; signing stays in a separate job.
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6.4.0
        if: steps.changes.outputs.build != 'false'
        with:
          cache-provider: basic
          # PRs and arbitrary dispatch branches must never populate trusted caches.
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')) }}
          dependency-graph: disabled
          build-scan-publish: false
      - uses: android-actions/setup-android@v4.0.4
        if: steps.changes.outputs.build != 'false'
        with:
          packages: platform-tools
      - name: Install Android SDK
        if: steps.changes.outputs.build != 'false'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Resolve release version
        if: steps.changes.outputs.build != 'false'
        id: version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
        if: steps.changes.outputs.build != 'false'
      - run: npx tsc --noEmit
        if: steps.changes.outputs.build != 'false'
      - run: npm run build
        if: steps.changes.outputs.build != 'false'
      - run: npx ng test --watch=false
        if: steps.changes.outputs.build != 'false'
      - run: npx cap sync android
        if: steps.changes.outputs.build != 'false'
      - name: Build release APK
        if: steps.changes.outputs.build != 'false'
        working-directory: android
        run: bash ./gradlew --no-daemon --init-script ../scripts/android-version.gradle assembleRelease
      - uses: actions/upload-artifact@v7.0.2
        if: steps.changes.outputs.build != 'false'
        with:
          name: unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: unsigned-apk
          path: unsigned
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install signing tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Sign and verify APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Add ANDROID_KEYSTORE_BASE64 to repository secrets}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Add ANDROID_KEYSTORE_PASSWORD to repository secrets}"
          : "${ANDROID_KEY_ALIAS:?Add ANDROID_KEY_ALIAS to repository secrets}"
          : "${ANDROID_KEY_PASSWORD:?Add ANDROID_KEY_PASSWORD to repository secrets}"
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p release
          "$tools/zipalign" -p -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          apk="release/lulio-baby-tracker-v$VERSION.apk"
          "$tools/apksigner" sign --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -c -p 4 "$apk"
          cd release
          sha256sum "lulio-baby-tracker-v$VERSION.apk" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Lulio: baby tracker $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "release/lulio-baby-tracker-v$VERSION.apk" release/SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
